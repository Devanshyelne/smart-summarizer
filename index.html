<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-blue-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-xl bg-white rounded-2xl shadow-xl border border-gray-100 p-8">

        <!-- Header -->
        <div class="flex items-center gap-3 mb-2">
            <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-xl">
                ✨
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Text Summarizer</h1>
        </div>
        <p class="text-sm text-gray-400 mb-1 ml-1">Powered by Google T5</p>
        <p class="text-gray-500 mb-6">Paste any article, email, or notes below — get the key points in seconds.</p>

        <!-- Form -->
        <form id="summarize-form">
            <textarea
                id="input-text"
                rows="6"
                placeholder="Paste or write your content here..."
                class="w-full border border-gray-200 rounded-xl p-4 mb-4 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition"
            ></textarea>

            <button
                type="submit"
                id="summarize-btn"
                class="w-full bg-indigo-600 text-white font-medium px-4 py-3 rounded-xl hover:bg-indigo-700 active:scale-[0.98] transition shadow-md shadow-indigo-200 disabled:opacity-60 disabled:cursor-not-allowed"
            >
                Summarize ✨
            </button>
        </form>

        <!-- Output -->
        <div id="summary-box" class="mt-6 bg-indigo-50/60 rounded-xl p-4 border border-indigo-100">
            <h3 class="text-sm font-semibold text-indigo-700 mb-2 flex items-center gap-1">
                📄 Summary
            </h3>
            <p id="summary-text" class="text-gray-600 text-sm leading-relaxed">
                Your summary will appear here.
            </p>
        </div>
    </div>

<script>
    const API_URL = "http://127.0.0.1:8000/summarize/"; // note trailing slash

    document.getElementById("summarize-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const inputText = document.getElementById("input-text");
        const summaryText = document.getElementById("summary-text");
        const submitButton = document.getElementById("summarize-btn");

        const text = inputText.value.trim();
        if (!text) {
            summaryText.textContent = "Please enter some text to summarize.";
            return;
        }

        summaryText.textContent = "Processing...";
        submitButton.disabled = true;

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ dialogue: text }), // key must match DialogueInput.dialogue
            });

            if (!response.ok) {
                throw new Error(`Server error: ${response.status}`);
            }

            const data = await response.json();
            summaryText.textContent = data || "No summary returned."; // backend returns a plain string
        } catch (err) {
            summaryText.textContent = `Error: ${err.message}. Make sure the backend server is running.`;
        } finally {
            submitButton.disabled = false;
        }
    });
</script>

</body>
</html>
